[project]
name = "labmcp-keithley-smu"
version = "0.1.1"
description = "MCP server for Keithley SourceMeter SMUs (2400 series SCPI, 2450 family SCPI, 2600B TSP): source V or I with compliance, measure, bounded IV sweeps that always end with the output off."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "K-Dense and LabMCP contributors" }]
keywords = ["mcp", "lab-instrument", "smu", "source-measure-unit", "keithley", "tektronix", "iv-curve", "scpi", "tsp"]
dependencies = ["labmcp[visa]>=0.1.2,<0.2"]

[project.scripts]
labmcp-keithley-smu = "labmcp_keithley_smu.server:main"

[project.urls]
Homepage = "https://github.com/K-Dense-AI/lab-instrument-mcps/tree/main/servers/physics/keithley-smu"

[tool.labmcp]
name = "Keithley SourceMeter SMU"
domain = "physics"
category = "Source-measure units"
vendor = "Keithley (Tektronix)"
models = ["2400", "2401", "2410", "2420", "2425", "2430", "2440", "2450", "2460", "2461", "2470", "2601B", "2602B", "2604B", "2611B", "2612B", "2614B", "2634B", "2635B", "2636B"]
interfaces = ["GPIB", "USB (USBTMC)", "Ethernet (LXI / raw socket)", "RS-232"]
protocol = "SCPI (2400 series, 2450 family) and TSP (2600B)"
summary = "Configure a voltage or current source with compliance, switch the output on/off, measure V and I, run bounded linear/log/dual IV sweeps with resistance fit and CSV export, 2/4-wire sense."
status = "simulated"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labmcp_keithley_smu"]
