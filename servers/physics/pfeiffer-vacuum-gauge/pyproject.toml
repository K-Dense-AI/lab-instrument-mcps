[project]
name = "labmcp-pfeiffer-tpg"
version = "0.1.0"
description = "MCP server for Pfeiffer Vacuum TPG 361/362/366 and TPG 261/262 gauge controllers: read and log pressures, gauge types, units, ionisation-gauge power."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "K-Dense and LabMCP contributors" }]
keywords = ["mcp", "lab-instrument", "vacuum", "pressure-gauge", "pfeiffer", "tpg", "physics"]
dependencies = ["labmcp>=0.1,<0.2"]

[project.scripts]
labmcp-pfeiffer-tpg = "labmcp_pfeiffer_tpg.server:main"

[project.urls]
Homepage = "https://github.com/K-Dense-AI/lab-instrument-mcps/tree/main/servers/physics/pfeiffer-vacuum-gauge"

[tool.labmcp]
name = "Pfeiffer Vacuum Gauge Controller"
domain = "physics"
category = "Vacuum measurement"
vendor = "Pfeiffer Vacuum"
models = ["TPG 361", "TPG 362", "TPG 366 MaxiGauge", "TPG 261", "TPG 262"]
interfaces = ["USB (virtual COM)", "Ethernet (TCP 8000)", "RS-232 (TPG 26x)"]
protocol = "Pfeiffer mnemonics protocol (ACK/NAK + ENQ)"
summary = "Read and log pressures with status per channel, identify gauges, change units, switch ionisation gauges on/off with a pressure interlock, read errors."
status = "simulated"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labmcp_pfeiffer_tpg"]
