[project]
name = "labmcp-scpi"
version = "0.1.3"
description = "Generic MCP server for any IEEE 488.2 / SCPI instrument (DMMs, scopes, SMUs, PSUs, generators, analyzers) over VISA, TCP socket or serial, with command allow/deny lists."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "K-Dense and LabMCP contributors" }]
keywords = ["mcp", "lab-instrument", "scpi", "ieee-488.2", "visa", "gpib", "usbtmc", "lxi", "oscilloscope", "multimeter", "power-supply"]
dependencies = ["labmcp[visa]>=0.1.2,<0.2"]

[project.scripts]
labmcp-scpi = "labmcp_scpi.server:main"

[project.urls]
Homepage = "https://github.com/K-Dense-AI/lab-instrument-mcps/tree/main/servers/protocols/scpi-instrument"

[tool.labmcp]
name = "Generic SCPI Instrument"
domain = "protocols"
category = "Test & Measurement"
vendor = "Any (SCPI / IEEE 488.2)"
models = [
    "Digital multimeters",
    "Oscilloscopes",
    "Source-measure units",
    "DC power supplies and electronic loads",
    "Function / arbitrary waveform generators",
    "Spectrum and network analyzers",
    "Frequency counters",
    "Any other SCPI or IEEE 488.2 instrument",
]
interfaces = ["GPIB (VISA)", "USBTMC (VISA)", "LAN VXI-11 / HiSLIP (VISA)", "LAN raw socket (e.g. port 5025)", "RS-232 / USB-serial"]
protocol = "SCPI-99 / IEEE 488.2"
summary = "Identify, query, write and batch raw SCPI with a query-only read path, configurable command allow/deny lists, error-queue checks, binary block transfer and a user-defined safe state."
registry_description = "Generic MCP server for any SCPI instrument over VISA, TCP or serial, with command allow/deny lists."
status = "simulated"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labmcp_scpi"]
