[project]
name = "labmcp-sartorius"
version = "0.1.1"
description = "MCP server for Sartorius laboratory balances (SBI protocol): weigh, tare, zero, log drift, internal adjustment."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "K-Dense and LabMCP contributors" }]
keywords = ["mcp", "lab-instrument", "balance", "sartorius", "sbi", "weighing"]
dependencies = ["labmcp>=0.1,<0.2"]

[project.scripts]
labmcp-sartorius = "labmcp_sartorius.server:main"

[project.urls]
Homepage = "https://github.com/K-Dense-AI/lab-instrument-mcps/tree/main/servers/chemistry/sartorius-balance"

[tool.labmcp]
name = "Sartorius Balance"
domain = "chemistry"
category = "Weighing"
vendor = "Sartorius"
models = ["Cubis MSE", "Cubis II MCA", "Secura", "Quintix", "Practum", "Entris II", "CP/CPA (legacy)"]
interfaces = ["RS-232", "USB (virtual COM)", "Ethernet (Cubis II)"]
protocol = "SBI (Sartorius Balance Interface)"
summary = "Weigh (stable/immediate), tare, zero, log drift series, internal adjustment, ambient filter, keypad lock."
status = "simulated"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labmcp_sartorius"]
