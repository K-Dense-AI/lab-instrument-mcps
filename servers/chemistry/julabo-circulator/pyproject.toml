[project]
name = "labmcp-julabo"
version = "0.1.2"
description = "MCP server for JULABO heating and refrigerated circulators (CORIO, MAGIO, DYNEO): read temperatures, set setpoint, start/stop, alarms."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "K-Dense and LabMCP contributors" }]
keywords = ["mcp", "lab-instrument", "julabo", "circulator", "thermostat", "chiller", "temperature-control"]
dependencies = ["labmcp>=0.1,<0.2"]

[project.scripts]
labmcp-julabo = "labmcp_julabo.server:main"

[project.urls]
Homepage = "https://github.com/K-Dense-AI/lab-instrument-mcps/tree/main/servers/chemistry/julabo-circulator"

[tool.labmcp]
name = "JULABO Circulator"
domain = "chemistry"
category = "Temperature control"
vendor = "JULABO"
models = ["CORIO CD", "CORIO CP", "MAGIO MS", "DYNEO DD"]
interfaces = ["USB (virtual COM)", "RS-232"]
protocol = "JULABO interface commands (in_/out_/status/version)"
summary = "Read bath/external temperature and heating power, set setpoint, start/stop tempering, decode status and alarms, wait for temperature."
status = "simulated"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labmcp_julabo"]
