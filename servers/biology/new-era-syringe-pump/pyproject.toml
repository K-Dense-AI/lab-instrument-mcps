[project]
name = "labmcp-new-era"
version = "0.1.0"
description = "MCP server for New Era Pump Systems syringe pumps (NE-1000 family, RS-232): set syringe, infuse/withdraw volumes, monitor, stop."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "K-Dense and LabMCP contributors" }]
keywords = ["mcp", "lab-instrument", "syringe-pump", "new-era", "ne-1000", "microfluidics", "rs-232"]
dependencies = ["labmcp>=0.1,<0.2"]

[project.scripts]
labmcp-new-era = "labmcp_new_era.server:main"

[project.urls]
Homepage = "https://github.com/K-Dense-AI/lab-instrument-mcps/tree/main/servers/biology/new-era-syringe-pump"

[tool.labmcp]
name = "New Era Syringe Pump"
domain = "biology"
category = "Liquid handling"
vendor = "New Era Pump Systems"
models = ["NE-1000", "NE-1002X", "NE-1010", "NE-4000", "NE-500 OEM", "NE-8000", "other NE-1000-series pumps with RS-232"]
interfaces = ["RS-232", "USB (RS-232 adapter)", "Serial-to-Ethernet"]
protocol = "New Era RS-232 Basic mode"
summary = "Set the syringe (presets or diameter), infuse or withdraw an exact volume at a set rate, track dispensed volume, stop."
status = "simulated"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labmcp_new_era"]
