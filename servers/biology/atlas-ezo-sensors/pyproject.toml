[project]
name = "labmcp-atlas-ezo"
version = "0.1.0"
description = "MCP server for Atlas Scientific EZO sensor circuits (pH, ORP, DO, EC, RTD, HUM, CO2, PRS) over UART: read, calibrate, compensate, log."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "K-Dense and LabMCP contributors" }]
keywords = ["mcp", "lab-instrument", "atlas-scientific", "ezo", "ph", "dissolved-oxygen", "conductivity", "bioreactor"]
dependencies = ["labmcp>=0.1,<0.2"]

[project.scripts]
labmcp-atlas-ezo = "labmcp_atlas_ezo.server:main"

[project.urls]
Homepage = "https://github.com/K-Dense-AI/lab-instrument-mcps/tree/main/servers/biology/atlas-ezo-sensors"

[tool.labmcp]
name = "Atlas Scientific EZO Sensors"
domain = "biology"
category = "Water Quality & Bioprocess Sensors"
vendor = "Atlas Scientific"
models = ["EZO-pH", "EZO-ORP", "EZO-DO", "EZO-EC", "EZO-RTD", "EZO-HUM", "EZO-CO2", "EZO-PRS"]
interfaces = ["UART (USB-serial adapter)", "Ethernet (serial bridge)"]
protocol = "Atlas Scientific EZO UART command set"
summary = "Read pH, ORP, dissolved oxygen, conductivity/TDS/salinity, temperature, humidity, CO2 or pressure; calibrate, set temperature compensation, log series."
status = "simulated"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labmcp_atlas_ezo"]
