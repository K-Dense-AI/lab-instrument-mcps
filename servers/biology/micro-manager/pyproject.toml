[project]
name = "labmcp-micro-manager"
version = "0.1.3"
description = "MCP server for microscopes controlled by Micro-Manager (pymmcore-plus): snap images, z-stacks and time-lapses, move stages safely, switch channels and objectives, autofocus."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "K-Dense and LabMCP contributors" }]
keywords = ["mcp", "lab-instrument", "microscopy", "micro-manager", "pymmcore-plus", "camera", "stage", "imaging"]
dependencies = ["labmcp>=0.1.2,<0.2", "pymmcore-plus>=0.16", "numpy>=1.24", "tifffile>=2023.1"]

[project.scripts]
labmcp-micro-manager = "labmcp_micro_manager.server:main"

[project.urls]
Homepage = "https://github.com/K-Dense-AI/lab-instrument-mcps/tree/main/servers/biology/micro-manager"

[tool.labmcp]
name = "Micro-Manager Microscope"
domain = "biology"
category = "Microscopy"
vendor = "Micro-Manager (open source; hundreds of camera, stage, filter and light-source vendors)"
models = ["Any microscope with a Micro-Manager hardware configuration (.cfg)", "Micro-Manager demo configuration"]
interfaces = ["USB", "Serial", "Camera Link / CoaXPress / GigE (through Micro-Manager device adapters)"]
protocol = "Micro-Manager MMCore API via pymmcore-plus"
summary = "Snap images (stats + preview + TIFF), z-stacks and time-lapses, move XY/Z within step and soft limits, channel/objective presets, exposure, shutter, autofocus."
status = "simulated"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labmcp_micro_manager"]
