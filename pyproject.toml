[project]
name = "lab-instrument-mcps"
version = "0.0.0"
description = "Monorepo of MCP servers for laboratory instruments (development workspace; not published)."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "tomli>=2; python_version < '3.11'",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "servers/*/*"]

[tool.uv.sources]
labmcp = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"
testpaths = ["packages", "servers"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM105"]
