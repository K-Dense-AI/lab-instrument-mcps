[project]
name = "labmcp"
version = "0.1.1"
description = "Shared foundations for MCP servers that control laboratory instruments: transports, simulators, safety limits, audit logging."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "K-Dense and LabMCP contributors" }]
keywords = ["mcp", "model-context-protocol", "laboratory", "instrument", "lab-automation", "fastmcp", "scpi", "visa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "fastmcp>=4.0,<5",
    "pyserial>=3.5",
]

[project.optional-dependencies]
visa = ["pyvisa>=1.14", "pyvisa-py>=0.7", "psutil", "zeroconf"]

[project.scripts]
labmcp = "labmcp.cli:main"

[project.urls]
Homepage = "https://github.com/K-Dense-AI/lab-instrument-mcps"
Issues = "https://github.com/K-Dense-AI/lab-instrument-mcps/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labmcp"]
